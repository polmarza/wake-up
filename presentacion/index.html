<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wake Up Heroes — Learning Heroes</title>

    <!--
      Sin CDN a propósito. Esto se proyecta en una sala con wifi de hackathon: si
      Tailwind o Lucide no cargan, la presentación se cae delante del jurado. Todo
      va embebido, los iconos son SVG inline y la tipografía tiene fallback de
      sistema. Funciona sin conexión.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --lh-cyan: #61f2f2;
        --lh-magenta: #ff2878;
        --lh-blue: #243f4c;
        --lh-white: #ffffff;
        --suave: #5f7280;
        --tenue: #93a5af;
        --borde: #dde5e9;
        --superficie: #f7f9fa;
        --alto: 64px;
        --pie: 76px;
        --easing: cubic-bezier(0.32, 0.72, 0, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        color: var(--lh-blue);
        background: var(--lh-white);
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Topbar ───────────────────────────────────────────────────────── */
      .topbar {
        position: fixed;
        inset: 0 0 auto 0;
        height: var(--alto);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 32px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--borde);
        z-index: 30;
      }
      .topbar.oculto {
        display: none;
      }
      /* El topbar acompaña a la slide oscura: una franja blanca encima de un fondo
         oscuro parte la pantalla justo donde no toca. */
      .topbar.oscuro {
        background: rgba(36, 63, 76, 0.92);
        border-bottom-color: rgba(255, 255, 255, 0.14);
      }
      .topbar.oscuro .titulo,
      .topbar.oscuro .contador {
        color: rgba(255, 255, 255, 0.62);
      }
      .topbar .punto {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: var(--lh-magenta);
      }
      .topbar .titulo {
        font-size: 17px;
        font-weight: 500;
        color: var(--suave);
      }
      .topbar .contador {
        margin-left: auto;
        font-size: 17px;
        font-weight: 500;
        color: var(--tenue);
      }
      .progreso {
        position: absolute;
        left: 0;
        bottom: -1px;
        height: 2px;
        background: var(--lh-magenta);
        transition: width 400ms var(--easing);
      }

      /* ── Slide ────────────────────────────────────────────────────────── */
      .escenario {
        position: fixed;
        top: var(--alto);
        bottom: var(--pie);
        left: 0;
        right: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .escenario.hero {
        top: 0;
      }
      .slide {
        min-height: 100%;
        padding: 48px 64px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 1400px;
        margin: 0 auto;
        animation: entrar 480ms var(--easing);
      }
      .slide.centro {
        align-items: center;
        text-align: center;
      }
      @keyframes entrar {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      h1 {
        font-size: clamp(48px, 6.5vw, 78px);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.02;
      }
      h2 {
        font-size: clamp(34px, 4vw, 50px);
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 1.08;
      }
      h3 {
        font-size: clamp(24px, 2.4vw, 33px);
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p,
      li {
        font-size: clamp(19px, 1.7vw, 23px);
        line-height: 1.55;
        color: var(--suave);
      }
      .sub {
        margin-top: 20px;
        max-width: 60ch;
      }
      .rotulo {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--tenue);
      }
      strong {
        color: var(--lh-blue);
        font-weight: 600;
      }
      .magenta {
        color: var(--lh-magenta);
      }

      /* ── Piezas ───────────────────────────────────────────────────────── */
      .rejilla {
        display: grid;
        gap: 22px;
        margin-top: 42px;
      }
      .r3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .r2 {
        grid-template-columns: repeat(2, 1fr);
      }
      @media (max-width: 900px) {
        .r3,
        .r2 {
          grid-template-columns: 1fr;
        }
      }

      .tarjeta {
        border: 1px solid var(--borde);
        border-radius: 16px;
        padding: 32px;
        background: var(--lh-white);
        transition:
          transform 200ms var(--easing),
          border-color 200ms var(--easing);
      }
      .tarjeta:hover {
        transform: translateY(-2px);
        border-color: var(--tenue);
      }
      .tarjeta h3 {
        margin-bottom: 10px;
      }
      .tarjeta p {
        font-size: 19px;
      }
      .tarjeta .cifra {
        font-size: 52px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.03em;
      }

      .cifrota {
        font-size: clamp(110px, 17vw, 210px);
        font-weight: 700;
        line-height: 0.88;
        letter-spacing: -0.045em;
      }

      .lista {
        list-style: none;
        margin-top: 34px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .lista li {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      .lista svg {
        flex: none;
        margin-top: 4px;
      }

      .barra-fila {
        margin-top: 22px;
      }
      .barra-fila .cabeza {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
      }
      .barra-fila .cabeza span:first-child {
        font-size: 22px;
        font-weight: 500;
        color: var(--lh-blue);
      }
      .canal {
        height: 42px;
        background: var(--superficie);
        border-radius: 8px;
        overflow: hidden;
        margin-top: 10px;
      }
      .relleno {
        height: 100%;
        border-radius: 8px;
        width: 0;
        transition: width 900ms var(--easing);
      }

      .aviso {
        margin-top: 34px;
        border: 1px solid rgba(240, 162, 2, 0.35);
        background: rgba(240, 162, 2, 0.07);
        border-radius: 16px;
        padding: 28px 32px;
      }
      .aviso p {
        font-size: 20px;
      }
      .aviso p + p {
        margin-top: 12px;
      }

      .correo {
        border: 1px solid var(--borde);
        border-radius: 16px;
        overflow: hidden;
        margin-top: 32px;
        background: var(--lh-white);
      }
      .correo .asunto {
        padding: 18px 30px;
        border-bottom: 1px solid var(--borde);
        background: var(--superficie);
        font-size: 21px;
        font-weight: 600;
      }
      .correo .cuerpo {
        padding: 26px 30px;
        font-size: 19.5px;
        line-height: 1.62;
        color: var(--lh-blue);
        white-space: pre-line;
        font-family: system-ui, -apple-system, sans-serif;
      }

      .oscuro {
        background: var(--lh-blue);
        color: var(--lh-white);
      }
      .oscuro h1,
      .oscuro h2,
      .oscuro h3,
      .oscuro strong {
        color: var(--lh-white);
      }
      .oscuro p,
      .oscuro li {
        color: rgba(255, 255, 255, 0.74);
      }
      .oscuro .rotulo {
        color: var(--lh-cyan);
      }
      .oscuro .tarjeta {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.14);
      }

      .chip {
        display: inline-block;
        padding: 7px 16px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 600;
        background: rgba(255, 40, 120, 0.1);
        color: var(--lh-magenta);
      }
      .chip.cian {
        background: rgba(97, 242, 242, 0.22);
        color: #0f7f7f;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 30px;
        font-size: 20px;
      }
      th {
        text-align: left;
        font-size: 15px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--tenue);
        padding: 0 14px 12px;
        font-weight: 600;
      }
      td {
        padding: 15px 14px;
        border-top: 1px solid var(--borde);
      }
      tr.gana td {
        background: rgba(97, 242, 242, 0.14);
      }
      tr.muere td {
        background: rgba(224, 49, 49, 0.06);
      }

      /* ── Pie de navegación ────────────────────────────────────────────── */
      .pie {
        position: fixed;
        inset: auto 0 0 0;
        height: var(--pie);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 0 32px;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(8px);
        border-top: 1px solid var(--borde);
        z-index: 30;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 600;
        padding: 13px 26px;
        border: 1px solid var(--borde);
        background: var(--lh-white);
        color: var(--lh-blue);
        transition: all 180ms var(--easing);
      }
      button:hover:not(:disabled) {
        border-color: var(--tenue);
        transform: translateY(-1px);
      }
      button.principal {
        background: var(--lh-magenta);
        border-color: var(--lh-magenta);
        color: var(--lh-white);
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      button:focus-visible {
        outline: 2px solid var(--lh-magenta);
        outline-offset: 2px;
      }
      .puntos {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .punto-nav {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--borde);
        border: none;
        padding: 0;
        cursor: pointer;
        transition: all 200ms var(--easing);
      }
      .punto-nav.on {
        background: var(--lh-magenta);
        width: 26px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>

  <body>
    <header class="topbar" id="topbar">
      <span id="logo-mini"></span>
      <span class="punto"></span>
      <span class="titulo">Wake Up Heroes</span>
      <span class="contador" id="contador"></span>
      <div class="progreso" id="progreso"></div>
    </header>

    <div class="escenario" id="escenario"><div class="slide" id="slide"></div></div>

    <nav class="pie">
      <button id="anterior">← Anterior</button>
      <div class="puntos" id="puntos"></div>
      <button id="siguiente" class="principal">Siguiente →</button>
    </nav>

    <script>
      function logoSVG(width = 122) {
        const height = (width * 32) / 122
        return `<svg width="${width}" height="${height}" viewBox="0 0 122 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Learning Heroes" role="img" style="color: currentColor; display: block;"><path d="M4.5568 11.6416H13.6704V15.0592H0V0.246399H4.5568V11.6384V11.6416Z" fill="currentColor"/><path d="M29.168 3.664H20.0544V5.9424H29.168V9.36H20.0544V11.6384H29.168V15.056H15.4976V0.246399H29.168V3.664Z" fill="currentColor"/><path d="M41.472 13.2352H35.7984L35.0912 15.0592H30.08L36.1184 0.246399H41.1296L47.168 15.056H42.1568C42.1568 15.056 41.8848 14.2816 41.472 13.232V13.2352ZM39.7632 8.7904C38.8064 6.24 38.8512 3.664 38.8512 3.664H38.3968C38.3968 3.664 38.4864 6.2624 37.4848 8.7904L37.0976 9.8144H40.1728C40.0352 9.4496 39.9008 9.1072 39.7632 8.7904Z" fill="currentColor"/><path d="M61.8656 15.0592H57.3088C57.3088 12.9408 57.2864 12.1888 56.8544 11.1872C56.2848 9.8208 55.1456 9.3632 53.664 9.3632H52.4096V15.0592H47.8528V0.246399H56.192C60.4992 0.246399 61.6384 2.1824 61.6384 4.2336C61.6384 5.9424 60.2272 7.3088 56.8544 7.3088H55.8304V7.7632C61.6416 7.7632 61.8688 12.208 61.8688 15.056L61.8656 15.0592ZM52.4096 6.1728H55.44C56.3072 6.1728 57.0816 5.7856 57.0816 4.9184C57.0816 4.0512 56.3072 3.664 55.44 3.664H52.4096V6.1696V6.1728Z" fill="currentColor"/><path d="M79.4368 15.0592H74.8576L71.6672 10.7968L66.448 3.8944H65.9936C65.9936 3.8944 68.0448 6.288 68.0448 9.136V15.0592H63.4656V0.246399H68.0224L68.0448 0.223999V0.246399L76.4768 11.4112H76.9312C76.9312 11.4112 74.88 9.0176 74.88 6.1696V0.246399H79.4368V15.056V15.0592Z" fill="currentColor"/><path d="M85.8176 0.246399V15.056H81.2608V0.246399H85.8176Z" fill="currentColor"/><path d="M103.613 15.0592H99.0336L95.8432 10.7968L90.624 3.8944H90.1696C90.1696 3.8944 92.2208 6.288 92.2208 9.136V15.0592H87.6416V0.246399H92.1984L92.2208 0.223999V0.246399L100.653 11.4112H101.107C101.107 11.4112 99.056 9.0176 99.056 6.1696V0.246399H103.613V15.056V15.0592Z" fill="currentColor"/><path d="M121.728 15.0592H117.354C117.264 1 .717 31.0848 107.146 30.0608C108.739 26.9856 107.35 29.7184 108.947 26.6432C109.814 27.2128 112.138 28.2368 114.416 28.2368C116.285 28.2368 117.174 27.872 117.174 26.9824C117.152 24.4768 107.834 27.0976 107.834 21.4016C107.834 18.3264 110.432 16.7296 114.122 16.7296C117.219 16.7296 119.341 17.5488 121.277 18.688C119.683 21.7408 119.658 21.7408 119.658 21.7408C117.29 19.9168 112.39 19.4624 112.39 21.2864C112.39 23.4752 121.731 21.4016 121.731 27.2096L121.728 27.2128Z" fill="currentColor"/></svg>`
      }

      const ico = {
        veto: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ff2878" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>`,
        ok: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#12a594" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`,
        punto: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#243f4c" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/></svg>`,
      }

      const slides = [
        {
          hero: true,
          html: `
            <div style="color: var(--lh-blue); margin-bottom: 46px;">${logoSVG(300)}</div>
            <h1>Wake&nbsp;Up<br />Heroes</h1>
            <p class="sub" style="font-size: 27px; max-width: 46ch;">
              Recuperamos alumnos que dejaron un curso a medias.
              Con criterio auditable, revisión humana y un grupo de control.
            </p>`,
        },
        {
          titulo: 'El problema',
          html: `
            <h2>Dos de cada tres personas que pagaron<br />están hoy fuera del circuito.</h2>
            <div class="rejilla r3">
              <div class="tarjeta"><div class="cifra">183</div><p style="margin-top:12px">alumnos inactivos, con el curso a medias</p></div>
              <div class="tarjeta"><div class="cifra">77</div><p style="margin-top:12px">lo terminaron y nadie les ofreció el siguiente paso</p></div>
              <div class="tarjeta"><div class="cifra magenta">222</div><p style="margin-top:12px">días de inactividad de mediana. Cuanto más pasa, más frío está</p></div>
            </div>`,
        },
        {
          titulo: 'Por qué no se hace ya',
          html: `
            <h2>No es falta de ganas.<br />Es coste por unidad.</h2>
            <ul class="lista">
              <li>${ico.veto}<span><strong>Escribir a mano no escala.</strong> El email que necesita quien se atascó en la sesión 2 no se parece al de quien terminó el curso entero.</span></li>
              <li>${ico.veto}<span><strong>El envío masivo es peor que no hacer nada.</strong> Quema la lista, dispara las bajas — y con 33 alumnos sin consentimiento, deja de ser un problema de conversión para ser uno legal.</span></li>
              <li>${ico.veto}<span><strong>Nadie sabe qué funciona.</strong> 317 emails y 42 vueltas, pero sin grupo de control ese 13% no dice nada: parte de esa gente habría vuelto sola.</span></li>
            </ul>`,
        },
        {
          titulo: 'Qué hemos construido',
          html: `
            <h2>Un panel que decide a quién escribir,<br />escribe el email y mide si sirvió.</h2>
            <div class="rejilla r3">
              <div class="tarjeta"><span class="chip">1 · A quién</span><h3 style="margin-top:16px">Política en SQL</h3><p>Consentimiento, rebotes, quejas, techo de intentos, enfriamiento. La aplicación no tiene otra forma de sacar candidatos.</p></div>
              <div class="tarjeta"><span class="chip">2 · Qué decir</span><h3 style="margin-top:16px">El sistema aprende</h3><p>Ocho variantes con sus propios contadores de éxito. Las que funcionan se usan más; las que no, se apagan solas.</p></div>
              <div class="tarjeta"><span class="chip">3 · Si sirvió</span><h3 style="margin-top:16px">Grupo de control</h3><p>El 15% de los alumnos no recibe nada nunca. Es la única forma de saber cuántos no habrían vuelto solos.</p></div>
            </div>
            <p style="margin-top:34px"><strong>Y ningún email sale sin que una persona lo lea y le dé al botón.</strong></p>`,
        },
        {
          titulo: 'A quién se puede escribir',
          html: `
            <div style="display:flex; align-items:baseline; gap:28px; flex-wrap:wrap;">

      let actual = 0
      const $ = (id) => document.getElementById(id)

      function pintar() {
        const s = slides[actual]
        const escenario = $('escenario')

        $('topbar').classList.toggle('oculto', !!s.hero)
        $('topbar').classList.toggle('oscuro', !!s.oscuro)
        $('logo-mini').firstElementChild.style.color = s.oscuro ? 'var(--lh-white)' : 'var(--lh-blue)'
        escenario.classList.toggle('hero', !!s.hero)

        const clases = ['slide']
        if (s.hero) clases.push('centro')
        escenario.innerHTML = `<div class="${clases.join(' ')}" id="slide">
          ${s.titulo && !s.hero ? `<span class="rotulo">${s.titulo}</span><div style="height:18px"></div>` : ''}
          ${s.html}
        </div>`

        document.body.style.background = s.oscuro ? 'var(--lh-blue)' : 'var(--lh-white)'
        escenario.style.background = s.oscuro ? 'var(--lh-blue)' : 'var(--lh-white)'
        escenario.querySelector('.slide').classList.toggle('oscuro', !!s.oscuro)

        $('contador').textContent = `${actual + 1} / ${slides.length}`
        $('progreso').style.width = `${((actual + 1) / slides.length) * 100}%`
        $('anterior').disabled = actual === 0
        $('siguiente').disabled = actual === slides.length - 1

        $('puntos').innerHTML = slides
          .map((_, i) => `<button class="punto-nav ${i === actual ? 'on' : ''}" data-i="${i}" aria-label="Slide ${i + 1}"></button>`)
          .join('')

        // Las barras se animan después de pintar, para que se vean crecer.
        requestAnimationFrame(() => {
          escenario.querySelectorAll('.relleno').forEach((barra) => {
            barra.style.width = `${barra.dataset.ancho}%`
          })
        })
      }

      function ir(n) {
        actual = Math.max(0, Math.min(slides.length - 1, n))
        pintar()
      }

      $('anterior').onclick = () => ir(actual - 1)
      $('siguiente').onclick = () => ir(actual + 1)
      $('puntos').onclick = (e) => {
        const b = e.target.closest('.punto-nav')
        if (b) ir(Number(b.dataset.i))
      }
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); ir(actual + 1) }
        if (e.key === 'ArrowLeft') ir(actual - 1)
      })

      $('logo-mini').innerHTML = `<span style="color: var(--lh-blue); display:block">${logoSVG(88)}</span>`
      pintar()
    </script>
